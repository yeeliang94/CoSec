<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Company particulars</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
input,select{width:100%;height:40px;box-sizing:border-box;padding:0 10px;border:1px solid #b9c2c9;border-radius:4px;font:inherit;color:#252b32;background:#ffffff}
legend{font-size:15px;font-weight:600;padding:0;margin-bottom:16px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
select{-webkit-appearance:none;appearance:none;padding-right:34px !important;background-image:url(/_blob/6de67599c7c5d719bba71e3ae53a6245) !important;background-repeat:no-repeat !important;background-position:right 12px center !important;background-size:12px 12px !important}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45; color: #252b32">
<dc-import name="CompanyOverview" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(28, 45, 57, 0.32)"></div>
<div role="dialog" aria-labelledby="cp-t" style="position: absolute; top: 0; right: 0; width: 650px; height: 900px; background: #ffffff; box-shadow: -12px 0 38px rgba(0, 0, 0, 0.12); display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 32px; border-bottom: 1px solid #e0e3e6">
<h2 id="cp-t" style="margin: 0; font-size: 17px; font-weight: 600">Company particulars</h2>
<a href="CompanyOverview.dc.html" aria-label="Close" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #606972"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div style="flex: 1 1 auto; overflow: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 48px; max-width: 640px">
<fieldset>
<legend>Company</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div><label for="o">Origin</label><select id="o"><option>Local</option></select></div>
<div><label for="s">Status of company</label><select id="s"><option>Existing</option></select></div>
</div>
<div><label for="t">Type of company</label><select id="t"><option>Private company limited by shares</option></select></div>
<div><label for="f">Former name (optional)</label><input id="f"></div>
</fieldset>
<fieldset>
<legend>Registered office</legend>
<div><label for="a1">Address</label><input id="a1" value="13 Jalan Contoh"></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div><label for="pc">Postcode</label><input id="pc" value="50450"></div>
<div><label for="ct">City</label><input id="ct" value="Kuala Lumpur"></div>
<div><label for="st">State</label><select id="st"><option>Kuala Lumpur</option></select></div>
</div>
</fieldset>
<fieldset>
<legend>Nature of business</legend>
<div><label for="d">Description</label><input id="d" value="Wholesale of timber products"></div>
<div><label for="m">Main MSIC code</label><input id="m" placeholder="Code or words, for example 62010 or programming" value="46632"></div>
</fieldset>
<fieldset>
<legend>Record the change</legend>
<div style="width: 50%"><label for="af">Applies from</label><input id="af" placeholder="dd/mm/yyyy"></div>
<div><label for="re">Reason</label><input id="re"></div>
</fieldset>
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px; padding: 16px 32px; border-top: 1px solid #e0e3e6">
<a href="CompanyOverview.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; box-sizing: border-box; border: 1px solid #cbd1d6; border-radius: 4px; color: #252b32; text-decoration: none">Cancel</a>
<button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 4px; background: #284b5c; color: #ffffff; font: inherit; font-weight: 500">Save particulars</button>
</div>
</div>
</div>
</x-dc>
