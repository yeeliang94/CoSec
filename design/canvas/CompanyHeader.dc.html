<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Company header and tabs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#284b5c;text-decoration:none}a:hover{color:#1e3b4b;text-decoration:underline}
.ctabs a{color:#606972;text-decoration:none}.ctabs a:hover{color:#252b32;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; min-width: 900px; box-sizing: border-box; color: #252b32; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45; background: #ffffff">
<a href="Companies.dc.html" style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #606972"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Companies</a>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-top: 8px">
<div>
<h1 style="margin: 0; font-size: 23px; font-weight: 600; line-height: 1.4">Meranti Trading Sdn. Bhd.</h1>
<div style="font-size: 11px; color: #606972; font-variant-numeric: tabular-nums">202000000002</div>
</div>
<a href="NewResolution.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; box-sizing: border-box; border-radius: 4px; background: #284b5c; color: #ffffff; font-size: 14px; font-weight: 500; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New resolution</a>
</div>
<p style="margin: 14px 0 0; display: flex; align-items: center; gap: 8px; font-size: 14px">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5f4c24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3zM12 10v4M12 17h.01"></path></svg>
<span>Opening company information is unverified.</span>
<a href="CompanyOpeningReview.dc.html" style="font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px">Review opening record<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></a>
</p>
<nav class="ctabs" aria-label="Company sections" style="display: flex; gap: 22px; margin-top: 20px; border-bottom: 1px solid #e0e3e6">
<a href="CompanyOverview.dc.html" style="padding: 8px 0 10px; margin-bottom: -1px; {{t.overview}}">Overview</a>
<a href="CompanyPeople.dc.html" style="padding: 8px 0 10px; margin-bottom: -1px; {{t.people}}">People</a>
<a href="CompanyShares.dc.html" style="padding: 8px 0 10px; margin-bottom: -1px; {{t.shares}}">Shares</a>
<a href="CompanyCharges.dc.html" style="padding: 8px 0 10px; margin-bottom: -1px; {{t.charges}}">Charges</a>
<a href="CompanyAnnualReturns.dc.html" style="padding: 8px 0 10px; margin-bottom: -1px; {{t.annual}}">Annual returns</a>
<a href="CompanyResolutions.dc.html" style="padding: 8px 0 10px; margin-bottom: -1px; {{t.resolutions}}">Resolutions</a>
<a href="CompanyDocuments.dc.html" style="padding: 8px 0 10px; margin-bottom: -1px; {{t.documents}}">Documents</a>
<a href="CompanySettings.dc.html" style="padding: 8px 0 10px; margin-bottom: -1px; {{t.settings}}">Resolution settings</a>
<a href="CompanyHistory.dc.html" style="padding: 8px 0 10px; margin-bottom: -1px; {{t.history}}">History</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["overview","people","shares","charges","annual","resolutions","documents","settings","history"],"default":"overview"},"$preview":{"width":1176,"height":190}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.tab ?? 'overview';
    const keys = ['overview', 'people', 'shares', 'charges', 'annual', 'resolutions', 'documents', 'settings', 'history'];
    const t = {};
    keys.forEach((k) => { t[k] = k === cur ? 'color: #252b32; font-weight: 500; border-bottom: 2px solid #284b5c;' : 'border-bottom: 2px solid transparent;'; });
    return { t };
  }
}
</script>
</body>
</html>
