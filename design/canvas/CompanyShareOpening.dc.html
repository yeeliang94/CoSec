<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record opening balance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
input[type=text],select{width:100%;height:40px;box-sizing:border-box;padding:0 10px;border:1px solid #b9c2c9;border-radius:4px;font:inherit;color:#252b32;background:#ffffff}
legend{font-size:15px;font-weight:600;padding:0;margin-bottom:16px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.ck{display:flex;align-items:center;gap:10px;font-weight:400;margin:0}
select{-webkit-appearance:none;appearance:none;padding-right:34px !important;background-image:url(/_blob/6de67599c7c5d719bba71e3ae53a6245) !important;background-repeat:no-repeat !important;background-position:right 12px center !important;background-size:12px 12px !important}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45; color: #252b32">
<dc-import name="CompanyShares" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(28, 45, 57, 0.32)"></div>
<div role="dialog" aria-labelledby="so-t" style="position: absolute; top: 0; right: 0; width: 650px; height: 900px; background: #ffffff; box-shadow: -12px 0 38px rgba(0, 0, 0, 0.12); display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 32px; border-bottom: 1px solid #e0e3e6">
<h2 id="so-t" style="margin: 0; font-size: 17px; font-weight: 600">Record opening balance</h2>
<a href="CompanyShares.dc.html" aria-label="Close" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #606972"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div style="flex: 1 1 auto; overflow: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 44px; max-width: 640px">
<fieldset>
<legend>Entry</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div><label for="d">Date</label><input type="text" id="d" value=""></div>
<div><label for="c">Share class</label><select id="c"><option>Ordinary shares</option><option>Redeemable preference shares</option></select></div>
<div><label for="n">Number of shares</label><input type="text" id="n" value=""></div>
</div>
</fieldset>
<fieldset>
<legend>To</legend>
<div><label for="h">Holder</label><input type="text" id="h" value="" placeholder="Type a name"></div>
<button type="button" style="align-self: flex-start; border: 0; background: transparent; padding: 0; font: inherit; font-size: 13px; font-weight: 500; color: #284b5c">Add joint holder</button>
<label class="ck"><input type="checkbox">Held as trustee</label>
</fieldset>
<fieldset>
<legend>Payment</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div><label for="ap">Amount payable (MYR)</label><input type="text" id="ap" value=""></div>
<div><label for="pd">Amount paid (MYR)</label><input type="text" id="pd" value=""></div>
</div>
<div><label for="co">Consideration</label><select id="co"><option>Cash</option><option>Otherwise than cash</option></select></div>
</fieldset>
<fieldset>
<legend>Source</legend>
<div><label for="so">Source</label><select id="so"><option selected>Select…</option><optgroup label="Resolutions"><option>Allotment of shares to Lim Wei Jie</option></optgroup><optgroup label="Documents"><option>Return of allotment.pdf</option><option>Instrument of transfer.pdf</option></optgroup></select></div>
<div><label for="no">Note (optional)</label><input type="text" id="no"></div>
</fieldset>
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px; padding: 16px 32px; border-top: 1px solid #e0e3e6">
<a href="CompanyShares.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; box-sizing: border-box; border: 1px solid #cbd1d6; border-radius: 4px; color: #252b32; text-decoration: none">Cancel</a>
<button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 4px; background: #284b5c; color: #ffffff; font: inherit; font-weight: 500">Save draft for review</button>
</div>
</div>
</div>
</x-dc>

</body>
</html>
