<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Import review header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#284b5c;text-decoration:none}a:hover{color:#1e3b4b;text-decoration:underline}
</style>
</helmet>
<header style="padding: 18px 30px 14px; border-bottom: 1px solid #e0e3e6; background: #ffffff; color: #252b32; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45">
<a href="ImportBatch.dc.html" style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #606972"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Client files, batch 2</a>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
<h1 style="margin: 0; font-size: 21px; font-weight: 600; line-height: 1.3">Meranti Trading Sdn. Bhd. <span style="font-weight: 400; color: #606972; font-size: 14px; font-variant-numeric: tabular-nums">202000000002</span></h1>
<div style="display: flex; gap: 8px">
<a href="ImportBatch.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; box-sizing: border-box; border: 1px solid #cbd1d6; border-radius: 4px; color: #252b32; text-decoration: none">Leave for later</a>
<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><a href="ImportApply.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; box-sizing: border-box; border-radius: 4px; background: #284b5c; color: #ffffff; font-weight: 500; text-decoration: none">Apply to records</a></sc-if><sc-if value="{{blocked}}" hint-placeholder-val="{{ true }}"><button type="button" disabled style="height: 36px; padding: 0 14px; border: 0; border-radius: 4px; background: #c9d1d6; color: #ffffff; font: inherit; font-weight: 500">Apply to records</button></sc-if>
</div>
</div>
<sc-if value="{{warn}}" hint-placeholder-val="{{ true }}">
<p style="margin: 10px 0 0; display: flex; align-items: center; gap: 8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5f4c24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3zM12 10v4M12 17h.01"></path></svg>2 questions need your answer before this company can be applied.<a href="ImportReviewQuestions.dc.html" style="font-size: 13px; font-weight: 500">Answer</a></p>
</sc-if>
<sc-if value="{{stray}}" hint-placeholder-val="{{ false }}">
<p style="margin: 10px 0 0; display: flex; align-items: center; gap: 8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8f2f2f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3zM12 10v4M12 17h.01"></path></svg>Some files look like they belong to another company. Place them before applying.<a href="ImportSort.dc.html" style="font-size: 13px; font-weight: 500">Place files</a></p>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"questions":{"editor":"boolean","default":true},"stray":{"editor":"boolean","default":false},"$preview":{"width":1384,"height":112}}'>
class Component extends DCLogic {
  renderVals() { const warn = this.props.questions ?? true; const stray = this.props.stray ?? false; return { warn, stray, blocked: warn || stray, ready: !warn && !stray }; }
}
</script>
</body>
</html>
