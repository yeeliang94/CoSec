<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45; color: #252b32">
<dc-import name="People" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(28, 45, 57, 0.32)"></div>
<div role="dialog" aria-labelledby="pp-t" style="position: absolute; top: 0; right: 0; width: 650px; height: 900px; background: #ffffff; box-shadow: -12px 0 38px rgba(0, 0, 0, 0.12); display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 32px; border-bottom: 1px solid #e0e3e6">
<h2 id="pp-t" style="margin: 0; font-size: 17px; font-weight: 600">Edit particulars</h2>
<a href="People.dc.html" aria-label="Close" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #606972"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>

<div style="flex: 1 1 auto; overflow: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 44px; max-width: 640px">
<fieldset>
<legend>Identity</legend>
<div style="width: 50%"><label for="ti">Title (optional)</label><select id="ti"><option>Encik</option></select></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div><label for="it">ID type</label><select id="it"><option>MyKad</option></select></div>
<div><label for="in">ID number</label><input type="text" id="in" value="820704-08-5531"></div>
<div><label for="db">Date of birth</label><input type="text" id="db" value="4 Jul 1982"></div>
<div><label for="na">Nationality</label><select id="na"><option>Malaysian</option></select></div>
</div>
</fieldset>
<fieldset>
<legend>Residential address</legend>
<div><label for="ra">Address</label><input type="text" id="ra" value="8 Jalan Bukit, Petaling Jaya"></div>
</fieldset>
<fieldset>
<legend>Service address</legend>
<label class="ck"><input type="checkbox" checked>Same as residential address</label>
</fieldset>
<fieldset>
<legend>Contact and work</legend>
<div><label for="oc">Occupation</label><input type="text" id="oc" value="Accountant"></div>
</fieldset>
<fieldset>
<legend>Record the change</legend>
<div style="width: 50%"><label for="af">Applies from</label><input type="text" id="af" placeholder="dd/mm/yyyy"></div>
<div><label for="re">Reason</label><input type="text" id="re"></div>
</fieldset>
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px; padding: 16px 32px; border-top: 1px solid #e0e3e6">
<a href="People.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; box-sizing: border-box; border: 1px solid #cbd1d6; border-radius: 4px; color: #252b32; text-decoration: none">Cancel</a>
<button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 4px; background: #284b5c; color: #ffffff; font: inherit; font-weight: 500">Save particulars</button>
</div>
</div>
</div>
