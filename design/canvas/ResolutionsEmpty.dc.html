<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resolutions – CoSec Workspace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#284b5c;text-decoration:none}a:hover{color:#1e3b4b;text-decoration:underline}
.tab{border:0;background:transparent;font:inherit;padding:8px 0 10px;color:#606972;cursor:pointer}
select{height:35px;padding:0 10px;border:1px solid #b9c2c9;border-radius:4px;font:inherit;color:#252b32;background:#ffffff}
select{-webkit-appearance:none;appearance:none;padding-right:34px !important;background-image:url(/_blob/6de67599c7c5d719bba71e3ae53a6245) !important;background-repeat:no-repeat !important;background-position:right 12px center !important;background-size:12px 12px !important}
</style>
</helmet>
<div style="display: flex; min-height: 900px; background: #ffffff; color: #252b32; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45">
<dc-import name="Sidebar" current="resolutions" hint-size="208px,900px"></dc-import>
<main style="flex: 1 1 0; min-width: 0; padding: 30px 32px 50px; box-sizing: border-box">
<header style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.45px; line-height: 1.3">Resolutions</h1>
<div style="display: flex; align-items: center; gap: 16px">
<a href="Templates.dc.html" style="font-size: 13px; font-weight: 500">Templates</a>
<a href="NewResolution.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; box-sizing: border-box; border-radius: 4px; background: #284b5c; color: #ffffff; font-weight: 500; text-decoration: none">New resolution</a>
</div>
</header>
<div role="tablist" style="display: flex; gap: 24px; margin-top: 18px; border-bottom: 1px solid #e0e3e6">
<button type="button" role="tab" class="tab" aria-selected="false">Open</button>
<button type="button" role="tab" class="tab" aria-selected="true" style="color: #252b32; font-weight: 500; border-bottom: 2px solid #284b5c; margin-bottom: -1px">Complete</button>
<button type="button" role="tab" class="tab" aria-selected="false">Cancelled</button>
<button type="button" role="tab" class="tab" aria-selected="false">All</button>
</div>
<div style="display: flex; gap: 8px; margin-top: 28px">
<input type="search" aria-label="Search resolutions" placeholder="Search resolutions" style="width: 280px; height: 35px; box-sizing: border-box; padding: 0 10px; border: 1px solid #b9c2c9; border-radius: 4px; font: inherit">
<select aria-label="Company" style="width: 218px"><option>All companies</option></select>
<select aria-label="Kind" style="width: 186px"><option>All kinds</option></select>
<select aria-label="Owner" style="width: 186px"><option>All owners</option></select>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 80px">
<p style="margin: 0; color: #606972">No complete resolutions</p>
<button type="button" style="height: 36px; padding: 0 14px; border: 1px solid #cbd1d6; border-radius: 4px; background: #ffffff; font: inherit">Show all</button>
</div>
</main>
</div>
</x-dc>
