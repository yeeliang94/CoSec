<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New staff account – Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#284b5c;text-decoration:none}a:hover{color:#1e3b4b;text-decoration:underline}
label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
input[type=text],input[type=password]{width:100%;height:40px;box-sizing:border-box;padding:0 10px;border:1px solid #b9c2c9;border-radius:4px;font:inherit;color:#252b32}
.opt{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e7eaed;font-weight:400;margin:0}
legend{font-size:13px;font-weight:500;padding:0;margin-bottom:4px}
</style>
</helmet>
<div style="display: flex; width: 1440px; height: 900px; overflow: hidden; background: #ffffff; color: #252b32; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45">
<dc-import name="Sidebar" current="settings" hint-size="208px,900px"></dc-import>
<main style="flex: 1 1 0; min-width: 0; padding: 30px 32px 50px; box-sizing: border-box; overflow: auto">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.45px; line-height: 1.3">Settings</h1>
<section aria-labelledby="nu-t" style="max-width: 640px; margin-top: 32px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; justify-content: space-between"><h2 id="nu-t" style="margin: 0; font-size: 17px; font-weight: 600">New staff account</h2><a href="Settings.dc.html" style="font-size: 13px; font-weight: 500">Close form</a></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div><label for="n">Name</label><input type="text" id="n"></div>
<div><label for="e">Email</label><input type="text" id="e"></div>
</div>
<div style="width: 50%"><label for="p">Initial password</label><input type="password" id="p"></div>
<fieldset style="border: 0; margin: 0; padding: 0">
<legend>Role</legend>
<label class="opt"><input type="radio" name="r" checked>User — prepares and reviews work, and sees identity numbers</label>
<label class="opt"><input type="radio" name="r">Admin — also manages users, settings and templates</label>
</fieldset>
<fieldset style="border: 0; margin: 0; padding: 0">
<legend>Company access</legend>
<label class="opt"><input type="checkbox">Aster Advisory Sdn. Bhd.</label>
<label class="opt"><input type="checkbox">Bayu Services Sdn. Bhd.</label>
<label class="opt"><input type="checkbox">Cedar Field Sdn. Bhd.</label>
<label class="opt"><input type="checkbox">Linden Ventures Sdn. Bhd.</label>
<label class="opt"><input type="checkbox">Meranti Trading Sdn. Bhd.</label>
<label class="opt"><input type="checkbox">Ruang Studio Sdn. Bhd.</label>
</fieldset>
<button type="button" style="align-self: flex-start; height: 36px; padding: 0 14px; border: 1px solid #cbd1d6; border-radius: 4px; background: #ffffff; font: inherit">Save account access</button>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
