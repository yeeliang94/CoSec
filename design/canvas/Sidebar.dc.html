<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.rail a{color:#c3ced7;text-decoration:none}
.rail a:hover{background:#283c4b}
</style>
</helmet>
<sc-if value="{{full}}" hint-placeholder-val="{{ true }}">
<aside class="rail" style="width: 208px; height: 100%; min-height: 900px; box-sizing: border-box; padding: 27px 13px 15px; background: #1c2d39; color: #c3ced7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; display: flex; flex-direction: column">
<a href="Main.dc.html" style="display: flex; flex-direction: column; gap: 2px; padding: 0 13px; color: #ffffff; font-size: 19px; font-weight: 600; letter-spacing: 0.4px">CoSec<span style="font-size: 11px; font-weight: 400; letter-spacing: 0; color: #e2e9ee">Workspace</span></a>
<div style="margin: 30px 13px 10px; font-size: 11px; color: #b7c4ce">Workspace</div>
<nav aria-label="Main navigation" style="display: flex; flex-direction: column; gap: 2px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 3px; {{sel.resolutions}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20H6zM9 7h6M9 11h6M9 15h3M13 18l1.5 1.5L18 16"></path></svg><span>Resolutions</span></a>
<a href="AnnualReturns.dc.html" style="display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 3px; {{sel.annual}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3M8 17h6"></path></svg><span>Annual returns</span></a>
<a href="Companies.dc.html" style="display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 3px; {{sel.companies}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5l8-2v18M12 8h8v13M2 21h20M7 8h2M7 12h2M7 16h2M15 12h2M15 16h2"></path></svg><span>Companies</span></a>
<a href="People.dc.html" style="display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 3px; {{sel.people}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.5-3.6 3.1-6 6.5-6s6 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.5c1.7.9 2.8 2.9 3 5.5"></path></svg><span>People</span></a>
<a href="Documents.dc.html" style="display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 3px; {{sel.documents}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"></path></svg><span>Documents</span></a>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="Settings.dc.html" style="display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 3px; {{sel.settings}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="m9 3 1-1h4l1 3 3 1 3 3-1 3 1 3-3 3-3 1-1 3h-4l-1-3-3-1-3-3 1-3-1-3 3-3 3-1z"></path></svg><span>Settings</span></a>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 0 0 9px; border-top: 1px solid #40515e; font-size: 12px; color: #e2e9ee">
<span>Aina Rahman</span>
<button type="button" style="border: 0; background: transparent; color: #c3ced7; font: inherit; font-size: 12px; cursor: pointer; padding: 4px">Sign out</button>
</div>
</div>
</aside>
</sc-if>
<sc-if value="{{narrow}}" hint-placeholder-val="{{ false }}">
<aside class="rail" style="width: 56px; height: 100%; min-height: 900px; box-sizing: border-box; padding: 22px 8px 15px; background: #1c2d39; color: #c3ced7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px">
<button type="button" aria-label="Expand navigation" style="width: 40px; height: 40px; border: 0; border-radius: 3px; background: transparent; color: #e2e9ee; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
<a href="Main.dc.html" aria-label="Resolutions" style="width: 40px; height: 40px; border-radius: 3px; display: flex; align-items: center; justify-content: center; {{sel.resolutions}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20H6zM9 7h6M9 11h6M9 15h3M13 18l1.5 1.5L18 16"></path></svg></a>
<a href="AnnualReturns.dc.html" aria-label="Annual returns" style="width: 40px; height: 40px; border-radius: 3px; display: flex; align-items: center; justify-content: center; {{sel.annual}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3M8 17h6"></path></svg></a>
<a href="Companies.dc.html" aria-label="Companies" style="width: 40px; height: 40px; border-radius: 3px; display: flex; align-items: center; justify-content: center; {{sel.companies}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5l8-2v18M12 8h8v13M2 21h20M7 8h2M7 12h2M7 16h2M15 12h2M15 16h2"></path></svg></a>
<a href="People.dc.html" aria-label="People" style="width: 40px; height: 40px; border-radius: 3px; display: flex; align-items: center; justify-content: center; {{sel.people}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.5-3.6 3.1-6 6.5-6s6 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.5c1.7.9 2.8 2.9 3 5.5"></path></svg></a>
<a href="Documents.dc.html" aria-label="Documents" style="width: 40px; height: 40px; border-radius: 3px; display: flex; align-items: center; justify-content: center; {{sel.documents}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"></path></svg></a>
<a href="Settings.dc.html" aria-label="Settings" style="margin-top: auto; width: 40px; height: 40px; border-radius: 3px; display: flex; align-items: center; justify-content: center; {{sel.settings}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="m9 3 1-1h4l1 3 3 1 3 3-1 3 1 3-3 3-3 1-1 3h-4l-1-3-3-1-3-3 1-3-1-3 3-3 3-1z"></path></svg></a>
</aside>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["resolutions","annual","companies","people","documents","settings","none"],"default":"resolutions"},"collapsed":{"editor":"boolean","default":false},"$preview":{"width":208,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? 'resolutions';
    const on = 'background: #314656; color: #ffffff;';
    const keys = ['resolutions', 'annual', 'companies', 'people', 'documents', 'settings'];
    const sel = {};
    keys.forEach((k) => { sel[k] = k === cur ? on : ''; });
    const collapsed = !!this.props.collapsed;
    return { sel, full: !collapsed, narrow: collapsed };
  }
}
</script>
</body>
</html>
