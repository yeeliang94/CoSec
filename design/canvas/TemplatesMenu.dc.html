<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>More actions menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.mi{display:block;width:100%;text-align:left;border:0;background:transparent;font:inherit;color:#252b32;padding:9px 14px;cursor:pointer}
.mi:hover{background:#f0f4f6}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45; color: #252b32">
<dc-import name="Templates" hint-size="1440px,900px"></dc-import>
<div role="menu" aria-label="More actions for Directors' fees" style="position: absolute; right: 40px; top: 470px; width: 240px; padding: 6px 0; background: #ffffff; border: 1px solid #e0e3e6; border-radius: 4px; box-shadow: 0 16px 60px rgba(0, 0, 0, 0.15)">
<button type="button" role="menuitem" class="mi">Copy</button>
<button type="button" role="menuitem" class="mi">Hide from new resolutions</button>
<div style="height: 1px; background: #e7eaed; margin: 6px 0"></div>
<button type="button" role="menuitem" class="mi" style="color: #a83230">Archive Directors' fees</button>
<button type="button" role="menuitem" class="mi">Keep</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
